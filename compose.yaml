version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite_storage
    ports:
      - "10000:10000" # Blob Service
      - "10001:10001" # Queue Service
      - "10002:10002" # Table Service
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck

  explorer:
    image: sebagomez/azurestorageexplorer
    container_name: azure_blob_explorer
    platform: linux/amd64 # Forces Apple Silicon to run the image under Rosetta 2 emulation
    ports:
      - "8080:8080"
    environment:
      - AZURE_STORAGE_CONNECTIONSTRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      - azurite

volumes:
  azurite_data:
    driver: local